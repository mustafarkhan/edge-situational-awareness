# GPU run (Kaggle T4 / rented GPU), scripts/kaggle/run_kaggle.sh. Same data and split as the CPU run, more epochs.
# Validation every epoch on the val split (never test) picks best.pt; patience stops early when val stops improving.
model: weights/yolo11n.pt
data: configs/datasets/visdrone.yaml
imgsz: 640
epochs: 80
patience: 25
batch: 32
workers: 4
cache: ram
cos_lr: true
close_mosaic: 10
plots: true
project: runs/gpu
name: vis_y11n_640
exist_ok: true
