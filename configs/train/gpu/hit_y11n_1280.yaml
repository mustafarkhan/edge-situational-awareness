# GPU run (Kaggle T4 / rented GPU), scripts/kaggle/run_kaggle.sh. Same data and split as the CPU run, more epochs.
# Validation every epoch on the val split (never test) picks best.pt; patience stops early when val stops improving.
# Round 2: the 640x512 thermal frames upscaled to a 1280 px input, so small people cover 4x the pixels at the model's input.
model: weights/yolo11n.pt
data: configs/datasets/hituav.yaml
imgsz: 1280
epochs: 120
patience: 25
batch: 8
workers: 4
cache: ram
cos_lr: true
close_mosaic: 10
plots: true
project: runs/gpu
name: hit_y11n_1280
exist_ok: true
