[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "esa"
version = "0.1.0"
description = "Edge AI for real-time situational awareness on NVIDIA Jetson (shared utilities)"
license = { text = "AGPL-3.0" }
requires-python = ">=3.10"

[tool.setuptools.packages.find]
where = ["src"]
