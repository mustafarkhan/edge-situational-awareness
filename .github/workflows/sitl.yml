name: SITL flight

# Flies the example search missions (sea, and land at night) in ArduPilot's software-in-the-loop simulator:
# upload mission + geofence with tools/fly_mission.py, arm, fly in AUTO, and check that every search waypoint
# was reached, the drone followed the planned tracks and never left the geofence.
on:
  push:
    branches: [main]
    paths: ["tools/fly_mission.py", "scripts/sitl_fly.sh", "src/esa/search.py", "src/esa/mission.py", "samples/*.plan", ".github/workflows/sitl.yml"]
  pull_request:
    paths: ["tools/fly_mission.py", "scripts/sitl_fly.sh", "src/esa/search.py", "src/esa/mission.py", "samples/*.plan", ".github/workflows/sitl.yml"]
  workflow_dispatch:

env:
  ARDUPILOT_TAG: Copter-4.7.2

defaults:
  run:
    shell: bash  # -eo pipefail: a failed flight must fail the step even when piped through grep

permissions:
  contents: read

jobs:
  fly:
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with: { python-version: "3.11" }
      - name: Cache the ArduCopter SITL build
        id: cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: ardupilot-sitl
          key: arducopter-sitl-${{ env.ARDUPILOT_TAG }}
      - name: Build ArduCopter SITL (first run only, ~12 min)
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          python -m pip install empy==3.3.4 pexpect future
          git clone -q --depth 1 --branch "$ARDUPILOT_TAG" https://github.com/ArduPilot/ardupilot.git ap
          cd ap && git submodule update -q --init --recursive --depth 1
          ./waf configure --board sitl > /dev/null && ./waf copter > /dev/null
          mkdir -p ../ardupilot-sitl/Tools/autotest/default_params
          cp build/sitl/bin/arducopter ../ardupilot-sitl/
          cp Tools/autotest/default_params/copter.parm ../ardupilot-sitl/Tools/autotest/default_params/
      - name: Python dependencies
        run: python -m pip install pymavlink && python -m pip install -e .
      - name: Fly the sea search mission
        run: |
          ARDUCOPTER=ardupilot-sitl/arducopter ARDUPILOT=ardupilot-sitl bash scripts/sitl_fly.sh samples/search_example.plan sitl_sea.json | grep -v "^autopilot: \|^reached item"
      - name: Fly the land (night, thermal) search mission
        run: |
          ARDUCOPTER=ardupilot-sitl/arducopter ARDUPILOT=ardupilot-sitl bash scripts/sitl_fly.sh samples/land_search_example.plan sitl_land.json | grep -v "^autopilot: \|^reached item"
      - name: Summary
        if: always()
        run: |
          for f in sitl_sea.json sitl_land.json; do
            [ -f "$f" ] || { echo "::error title=$f::no report"; continue; }
            python -c "import json,sys; d=json.load(open(sys.argv[1])); d.pop('autopilot_messages', None); print('::notice title=' + sys.argv[1] + '::' + json.dumps(d))" "$f"
          done
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        if: always()
        with: { name: sitl-reports, path: "sitl_*" }  # reports and flown tracks
