name: ROS 2

# Builds the ROS 2 package and runs the detector node end to end on real images:
# checks that /detections, /tracks_geo and /alerts are actually published.
on:
  push:
    branches: [main]
    paths: ["ros2_ws/**", "src/esa/**", ".github/workflows/ros2.yml"]
  workflow_dispatch:

jobs:
  humble:
    name: Humble build + run
    runs-on: ubuntu-22.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: ros-tooling/setup-ros@v0.7
        with:
          required-ros-distributions: humble
      - name: ROS dependencies
        run: sudo apt-get update && sudo apt-get install -y ros-humble-vision-msgs
      - name: Python dependencies (CPU PyTorch; NumPy 1.x to match ROS Humble's compiled message code)
        run: |
          python3 -m pip install --upgrade pip
          python3 -m pip install torch torchvision --index-url https://download.pytorch.org/whl/cpu
          python3 -m pip install "numpy<2" "opencv-python<4.12" ultralytics lap
          python3 -m pip install -e .
      - name: colcon build
        run: |
          source /opt/ros/humble/setup.bash
          cd ros2_ws && colcon build --symlink-install
      - name: Run the node and check its topics (camera straight down)
        run: bash ros2_ws/test_node.sh
      - name: Run the node and check its topics (gimbal tilted 45 degrees, tilt-aware geolocation)
        run: PITCH=45.0 bash ros2_ws/test_node.sh
