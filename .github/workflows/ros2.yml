name: ROS 2

# Builds the ROS 2 package and runs the detector node end to end on real images:
# checks that /detections, /tracks_geo and /alerts are actually published.
on:
  push:
    branches: [main]
    paths: ["ros2_ws/**", "src/esa/**", "tools/fly_mission.py", ".github/workflows/ros2.yml"]
  pull_request:
    paths: ["ros2_ws/**", "src/esa/**", "tools/fly_mission.py", ".github/workflows/ros2.yml"]
  workflow_dispatch:

jobs:
  humble:
    name: Humble build + run
    runs-on: ubuntu-22.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: ros-tooling/setup-ros@v0.7
        with:
          required-ros-distributions: humble
      - name: ROS dependencies
        run: sudo apt-get update && sudo apt-get install -y ros-humble-vision-msgs ros-humble-sensor-msgs
      - name: Python dependencies (CPU PyTorch; NumPy 1.x to match ROS Humble's compiled message code)
        run: |
          python3 -m pip install --upgrade pip
          python3 -m pip install torch torchvision --index-url https://download.pytorch.org/whl/cpu
          python3 -m pip install "numpy<2" "opencv-python<4.12" ultralytics lap
          python3 -m pip install -e .
      - name: colcon build
        run: |
          source /opt/ros/humble/setup.bash
          cd ros2_ws && colcon build --symlink-install
      - name: Run the node and check its topics (camera straight down)
        run: bash ros2_ws/test_node.sh
      - name: Run the node and check its topics (gimbal tilted 45 degrees, tilt-aware geolocation)
        run: PITCH=45.0 bash ros2_ws/test_node.sh
      - name: Run the node and check its topics (live telemetry topics, as from MAVROS)
        run: TELEMETRY=1 bash ros2_ws/test_node.sh
      - name: Run the node and check its topics (camera frames from a sensor_msgs/Image topic)
        run: IMAGE_TOPIC=1 bash ros2_ws/test_node.sh
      - name: RGB + thermal launch starts both detectors and records a bag
        shell: bash
        run: |
          source /opt/ros/humble/setup.bash && source ros2_ws/install/setup.bash
          ros2 launch esa_ros esa.launch.py --show-args > /dev/null
          BAGS=$(mktemp -d)
          timeout -s INT 40 ros2 launch esa_ros esa_dual.launch.py record:=true bag_dir:="$BAGS" > dual.log 2>&1 || true
          cat dual.log
          grep -q "camera=rgb" dual.log && grep -q "camera=thermal" dual.log
          shopt -s nullglob
          bags=("$BAGS"/sortie_*/*.db3 "$BAGS"/sortie_*/*.mcap)
          [ ${#bags[@]} -gt 0 ] || { echo "::error title=rosbag::no bag written"; ls -R "$BAGS"; exit 1; }
          echo "bag written: ${bags[*]}"
