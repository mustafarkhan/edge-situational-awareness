name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  python:
    name: Lint and unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: "Install (light: no PyTorch needed for the unit tests)"
        run: pip install ruff pytest numpy pandas pillow pyyaml pycocotools motmetrics fastapi httpx "uvicorn[standard]" && pip install -e .
      - name: Lint
        run: ruff check .
      - name: Format
        run: ruff format --check .
      - name: Unit tests (none may be skipped)
        shell: bash  # -eo pipefail: a failing test must fail the step even through tee
        run: pytest -q -rs | tee pytest.log && ! grep -q "SKIPPED" pytest.log
      - name: README numbers match the results files
        run: python benchmarks/check_readme.py

  tak:
    name: TAK end to end (real TAK server)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install the bridge and an open-source TAK server (taky)
        run: |
          pip install fastapi "uvicorn[standard]" websockets
          python -m venv /tmp/taky && /tmp/taky/bin/pip install taky "setuptools<70"
      - name: Bridge -> TAK server -> TAK client, with an operator rejecting an alert
        run: python tests/tak_e2e.py --taky /tmp/taky/bin/taky

  quickstart:
    name: README quick start on the sample clip
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install (CPU PyTorch)
        run: |
          pip install torch torchvision --index-url https://download.pytorch.org/whl/cpu
          pip install ultralytics lap && pip install -e .
      - name: Detect, track, geolocate and alert on real sea footage
        run: |
          python tools/detect_video.py --model models/sds_y11n_1280_gpu.pt --source samples/sea_DJI_0055/frames \
            --imgsz 1280 --conf 0.1 --telemetry samples/sea_DJI_0055/telemetry.jsonl \
            --alert swimmer --alert-min-frames 15 --out outputs/my_run.jsonl | tee run.log
          python - <<'PY'
          import json
          recs = [json.loads(l) for l in open("outputs/my_run.jsonl")]
          dets = [d for r in recs for d in r["detections"]]
          located = [d for d in dets if d["lat"] is not None]
          swimmers = {d["track_id"] for d in dets if d["label"] == "swimmer" and d["track_id"] is not None}
          print(f"frames {len(recs)}, detections {len(dets)}, geolocated {len(located)}, swimmer tracks {len(swimmers)}")
          assert len(recs) == 30 and len(located) > 100 and len(swimmers) >= 5
          PY
          grep -q "ALERT: swimmer" run.log

  frontend:
    name: Build the map app
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web/frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: web/frontend/package-lock.json
      - run: npm ci
      - run: npx vite build

  browser:
    name: Operator map in a real browser (auth, XSS, CSP)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: web/frontend/package-lock.json
      - name: Install the server and a headless browser
        run: |
          pip install fastapi "uvicorn[standard]" playwright && pip install -e .
          python -m playwright install --with-deps chromium
      - name: Build the map app
        working-directory: web/frontend
        run: npm ci && npx vite build
      - name: Token required, labels never run as script, no CSP violations, reviews attributed
        run: python tests/browser_e2e.py
